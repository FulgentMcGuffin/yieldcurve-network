[project]
name = "yieldcurve-network"
version = "0.1.0"
description = "Temporal and multilayer network analysis of multivariate panel time series"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "dcor>=0.7",
    "duckdb>=1.6.0.dev343",
    "framecache",
    "graspologic",
    "ipykernel>=7.3.0",
    "ipython>=9.16.1",
    "networkx>=3.6.1",
    "numba>=0.66",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=7.0.0rc0",
    "plotnine>=0.15.7",
    "polars>=1.43.2",
    "py3plex",
    "pyarrow>=25.0.1",
    "pyside6>=6.8",
    "python-dotenv>=1.1.0",
    "pyvis>=0.3.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
ace = ["ace-cream"]

[project.scripts]
ycn-gui = "ycn.gui.app:main"

[tool.uv.sources]
ace-cream = { git = "https://github.com/FulgentMcGuffin/ace_cream.git" }
framecache = { git = "https://github.com/FulgentMcGuffin/framecache.git" }
graspologic = { git = "https://github.com/FulgentMcGuffin/graspologic.git" }
py3plex = { git = "https://github.com/SkBlaz/py3plex.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ycn"]
