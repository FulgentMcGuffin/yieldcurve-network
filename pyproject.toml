[project]
name = "yieldcurve-network"
version = "0.1.0"
description = "Temporal and multilayer network analysis of multivariate panel time series"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "dcor>=0.7",
    "duckdb>=1.6.0.dev343",
    "framecache",
    "graspologic",
    "ipykernel>=7.3.0",
    "ipython>=9.16.1",
    "networkx>=3.6.1",
    "numba>=0.66",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=7.0.0rc0",
    "plotnine>=0.15.7",
    "polars>=1.43.2",
    "py3plex",
    "pyarrow>=25.0.1",
    "pyside6>=6.8",
    "python-dotenv>=1.1.0",
    "pyvis>=0.3.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
ace = ["ace-cream"]
# Only the experimental neural HJM residual model needs torch. Kept out of the
# core so `uv sync` stays small; see ycn.analysis.af_neural.
neural = ["torch>=2.5"]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-cov>=7.0"]

[project.scripts]
ycn-gui = "ycn.gui.app:main"

[tool.uv.sources]
ace-cream = { git = "https://github.com/FulgentMcGuffin/ace_cream.git" }
framecache = { git = "https://github.com/FulgentMcGuffin/framecache.git" }
graspologic = { git = "https://github.com/FulgentMcGuffin/graspologic.git" }
py3plex = { git = "https://github.com/SkBlaz/py3plex.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ycn"]

[tool.black]
# Pinned to the interpreter this project targets. Left unset, recent Black
# assumes a newer Python than requires-python allows and its AST safety check
# then refuses to verify the result.
target-version = ["py313"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: takes more than a second",
    "neural: requires the `neural` extra (torch)",
]
